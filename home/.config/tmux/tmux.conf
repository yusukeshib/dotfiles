# ============================================================================
# General Settings
# ============================================================================

# Use vi-style key bindings in copy mode
set -g mode-keys vi
set -g @shell_mode vi
set -g status-keys vi

# Enable mouse support for scrolling and pane selection
set -g mouse on

# Allow programs to detect focus events
set -g focus-events on

# Allow passthrough escape sequences (image protocols, OSC 52, etc.)
set -g allow-passthrough on

# Enable extended keys (CSI u) so modified Enter/other keys are reported
set -g extended-keys on

# Tell applications inside tmux to use the tmux terminfo entry
set -g default-terminal "tmux-256color"

# Keep the terminal's truecolor capability when creating or attaching sessions.
set -ag update-environment " COLORTERM"

# Enable true color for common 256-color terminals and Ghostty
set -ga terminal-overrides ",xterm-256color:Tc"
set -ga terminal-overrides ",screen-256color:Tc"
set -ga terminal-overrides ",xterm-ghostty:Tc"

# Pass OSC 8 hyperlinks through to the outer terminal (Ghostty).
# NOTE: because `mouse on` makes tmux capture mouse events, a plain ⌘-click
# goes to tmux, not Ghostty. Hold Shift to bypass tmux mouse reporting:
#   ⇧⌘-click  -> open the link in Ghostty
set -as terminal-features ",xterm-ghostty:hyperlinks"

# Forward tmux copies to the terminal clipboard when possible (OSC 52)
set -s set-clipboard on

# Set scrollback buffer size to 30,000 lines
set -g history-limit 30000

# Start window numbering at 1 instead of 0 (easier to reach on keyboard)
set -g base-index 1

# Start pane numbering at 1 instead of 0
set -g pane-base-index 1

# Keep window numbers contiguous after closing a window
set -g renumber-windows on

# Use CSI u format for extended keys (allows modifiers on Enter, Tab, etc.)
set -g extended-keys-format csi-u

# ============================================================================
# Colors & Status Bar
# ============================================================================

# Move the status bar (window list / "tabs") to the bottom of the screen
set -g status-position bottom

# Use the terminal's default colors and ANSI palette so theme changes propagate.
set -g status-style 'fg=default,bg=default'

# Keep inactive windows readable without competing with the active one
set -g window-status-style 'fg=default,bg=default'
set -g window-status-format ' #I:#W#{?window_flags,#{window_flags},} '

# Give the active window a palette-based green highlight with dark text
set -g window-status-current-style 'fg=colour0,bg=colour10,bold'
set -g window-status-current-format ' #I:#W#{?window_flags,#{window_flags},} '

# Ignore double-clicks on the status bar (including window/tab labels).
unbind-key -n DoubleClick1Status

# Show hostname on the right side of status bar with CPU usage
# #H = tmux's built-in full hostname (no per-refresh `#(hostname)` subprocess)
set -g status-right '#{prefix_highlight} #{cpu_percentage} #[default]%a %Y-%m-%d %H:%M #H'
set -g status-right-length 80

# ============================================================================
# Pane Borders (make the focused pane stand out)
# ============================================================================

# Dim inactive pane borders, bright green border around the active pane
set -g pane-border-style 'fg=colour8'
set -g pane-active-border-style 'fg=colour10,bold'

# Keep only split separators, without a title/status line above each pane
set -g pane-border-status off


# ============================================================================
# Activity Monitoring
# ============================================================================

# Monitor for activity in other windows
set -g monitor-activity on

# Don't show popup message when activity occurs (just highlight in status bar)
set -g visual-activity off

# Highlight windows with activity in yellow and bold
set -g window-status-activity-style 'fg=colour3,bg=default,bold'

# Monitor for bells in other windows
set -g monitor-bell on

# Don't show visual flash when bell occurs
set -g visual-bell off

# Highlight windows with bells in red and bold
set -g window-status-bell-style 'fg=colour1,bg=default,bold'

# ============================================================================
# macOS Integration
# ============================================================================

# Vi-style visual selection in copy mode
bind-key -T copy-mode-vi v send-keys -X begin-selection

# Copy selections into the macOS clipboard when pbcopy exists
if-shell 'command -v pbcopy >/dev/null 2>&1' \
  "bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'pbcopy'; bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel 'pbcopy'; bind-key Y run-shell 'tmux save-buffer - | pbcopy'" \
  "bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel; bind-key -T copy-mode-vi Enter send-keys -X copy-selection-and-cancel; bind-key Y copy-buffer"

# Paste from tmux buffer with prefix + p
bind-key p paste-buffer

# ============================================================================
# Key Bindings
# ============================================================================

# Change prefix from C-b to C-z (easier to reach)
set -g prefix C-z

# Reduce escape time for faster key response (10ms recommended for vim users)
set -s escape-time 10

# Reload config file with prefix + r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Reloaded config !!"

# Unbind default keys that we're replacing
unbind-key C-b
unbind-key %
unbind-key '"'

# Allow C-z C-z to send C-z to the terminal
bind-key C-z send-prefix

# Keep zoom toggle on an easy key even with the custom prefix
bind-key z resize-pane -Z

# Split panes intuitively: | for vertical split, - for horizontal split
# Inherit the current pane's working directory in the new pane
bind-key - split-window -v -c "#{pane_current_path}"
bind-key | split-window -h -c "#{pane_current_path}"

# Resize panes with vim-style keys (repeatable with -r flag)
bind-key -r H resize-pane -L 2
bind-key -r J resize-pane -D 2
bind-key -r K resize-pane -U 2
bind-key -r L resize-pane -R 2

# Display pane numbers with prefix + i
bind-key i display-panes

# Disable the default prefix + x kill-pane shortcut; use prefix + k with confirmation
unbind-key x
bind-key k confirm-before 'kill-pane'

# ============================================================================
# Plugins (TPM)
# ============================================================================

# TPM plugin manager
set -g @plugin 'tmux-plugins/tpm'

# Clipboard integration
set -g @plugin 'tmux-plugins/tmux-yank'

# Show prefix key press status
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'

# CPU and RAM monitoring
set -g @plugin 'tmux-plugins/tmux-cpu'

# ============================================================================
# Plugin Settings
# ============================================================================

# CPU plugin color settings
set -g @cpu_low_fg_color 'colour2'        # Green for low usage (< 30%)
set -g @cpu_medium_fg_color 'colour3'    # Yellow for medium usage (30-80%)
set -g @cpu_high_fg_color 'colour1'      # Red for high usage (> 80%)
set -g @cpu_low_thresh '30'
set -g @cpu_medium_thresh '50'
set -g @cpu_high_thresh '80'

# TPM is provisioned explicitly by bootstrap.sh; never download and execute
# remote code during interactive tmux startup.
if "test -x ~/.tmux/plugins/tpm/tpm" \
   "run '~/.tmux/plugins/tpm/tpm'"
